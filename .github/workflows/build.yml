name: Build Chiaki for iPadOS 26.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.1.1
        shell: bash
        run: |
          set -e

          if [ -d "/Applications/Xcode_26.1.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.1.1.app"
          else
            echo "Xcode 26.1.1 not found"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          xcodebuild -version
          xcodebuild -showsdks

      - name: Install Qt
        shell: bash
        run: |
          set -e

          brew update

          echo "Installing Qt..."
          brew install qt@5

          QT_PREFIX="$(brew --prefix qt@5)"

          echo "Qt prefix:"
          echo "$QT_PREFIX"

          echo "Qt binaries:"
          find "$QT_PREFIX" -maxdepth 4 -type f \
            \( -name qmake -o -name qmake6 \) \
            -print || true

          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"

      - name: Check Qt
        shell: bash
        run: |
          set -e

          echo "QT_PREFIX=$QT_PREFIX"

          if [ -f "$QT_PREFIX/bin/qmake" ]; then
            "$QT_PREFIX/bin/qmake" -v
          else
            echo "Qt 5 qmake was not found."
            find "$QT_PREFIX" -type f -name qmake -print || true
            exit 1
          fi

      - name: Inspect project
        run: |
          xcodebuild \
            -list \
            -project "Chiaki iOS.xcodeproj"

      - name: Patch hard-coded Qt path
        shell: bash
        run: |
          set -e

          echo "Searching for old Qt paths..."

          grep -R \
            -n \
            "/Users/teun/Qt" \
            "Chiaki iOS.xcodeproj" \
            chiaki.pro \
            . \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

          echo ""
          echo "Project build settings containing Qt paths:"
          grep -R \
            -n \
            "Qt/5.15.2" \
            "Chiaki iOS.xcodeproj" \
            || true

      - name: Prepare Qt iOS
        shell: bash
        run: |
          set -e

          QT_PREFIX="$QT_PREFIX"

          echo "Qt installation:"
          find "$QT_PREFIX" -maxdepth 3 -type d | head -100

          echo ""
          echo "qmake:"
          find "$QT_PREFIX" -type f -name qmake -print || true

      - name: Build Chiaki
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          echo "Using Xcode:"
          xcodebuild -version

          echo ""
          echo "Using SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "Building scheme: chiaki"

          xcodebuild \
            -project "Chiaki iOS.xcodeproj" \
            -scheme "chiaki" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Find Chiaki.app
        id: app
        shell: bash
        run: |
          set -e

          echo "Searching for Chiaki.app..."

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE" \
            -type d \
            -name "Chiaki.app" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Chiaki.app was not produced."
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Inspect application
        shell: bash
        run: |
          set +e

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "Device family:"
          /usr/libexec/PlistBuddy \
            -c "Print :UIDeviceFamily" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "Minimum iOS version:"
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "Architectures:"
          file "$APP_PATH/Chiaki" || true

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/Chiaki.app

          cd build

          zip -r \
            Chiaki-iPadOS-26.1-unsigned.ipa \
            Payload

          echo ""
          echo "IPA:"
          ls -lh Chiaki-iPadOS-26.1-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-iPadOS-26.1-unsigned
          path: build/Chiaki-iPadOS-26.1-unsigned.ipa
          retention-days: 7

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
