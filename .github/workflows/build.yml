name: Build Chiaki iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -list \
            -project "Chiaki iOS.xcodeproj"

      - name: Build unsigned IPA
        run: |
          rm -rf build
          mkdir -p build/Payload

          xcodebuild \
            -project "Chiaki iOS.xcodeproj" \
            -scheme "Chiaki iOS" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Chiaki.app was not produced."
            exit 1
          fi

          echo "Found app: $APP_PATH"

          cp -R "$APP_PATH" build/Payload/Chiaki.app

          cd build
          zip -r Chiaki-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Chiaki-iOS-unsigned
          path: build/Chiaki-unsigned.ipa
          retention-days: 7
