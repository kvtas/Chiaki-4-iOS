name: Build Chiaki iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild -list -project "Chiaki iOS.xcodeproj"

      - name: Build
        run: |
          set -o pipefail

          xcodebuild \
            -project "Chiaki iOS.xcodeproj" \
            -scheme "Chiaki iOS" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
